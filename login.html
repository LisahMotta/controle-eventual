<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · Controle Eventual</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .glow {
      position: fixed; inset: -25% 0 auto 0; height: 460px; pointer-events: none; z-index: 0;
      background: radial-gradient(55% 100% at 50% 0%, rgba(34,197,94,.14), transparent 70%);
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 30px;
      box-shadow: 0 24px 60px -24px rgba(0,0,0,.6);
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .brand .mark {
      width: 34px; height: 34px; border-radius: 9px; flex: none;
      background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center; font-weight: 800; font-size: 17px;
    }
    .brand .name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }

    h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 4px; font-weight: 700; }
    .sub { margin: 0 0 24px; color: var(--fg-muted); font-size: 14.5px; }

    form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    label { font-size: 13px; font-weight: 600; color: var(--fg); }

    input[type="email"], input[type="password"] {
      width: 100%; min-height: 44px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      color: var(--fg);
      font-size: 15px;
      padding: 0 14px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder { color: var(--fg-faint); }
    input:focus-visible {
      outline: none;
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(34,197,94,.25);
    }

    /* botão "esqueci a senha" */
    .forgot {
      background: none; border: 0; padding: 0;
      color: var(--info);
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      border-radius: 4px;
    }
    .forgot:hover { text-decoration: underline; }
    .forgot:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

    .remember { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--fg-muted); cursor: pointer; user-select: none; }
    .remember input { width: 16px; height: 16px; accent-color: var(--accent); }

    .submit {
      min-height: 46px; margin-top: 4px;
      background: var(--accent); color: var(--on-accent);
      border: 0; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s ease;
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(34,197,94,.35); }

    .signup { margin: 22px 0 0; text-align: center; font-size: 13.5px; color: var(--fg-muted); }
    .signup a { color: var(--info); font-weight: 600; text-decoration: none; }
    .signup a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="card">
    <div class="brand">
      <span class="mark">CE</span>
      <span class="name">Controle Eventual</span>
    </div>

    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta para gerenciar os plantões.</p>

    <form action="#" method="post" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="voce@exemplo.com" required />
      </div>

      <div class="field">
        <div class="label-row">
          <label for="senha">Senha</label>
          <button type="button" class="forgot" onclick="location.href='recuperar-senha.html'">
            Esqueci a senha
          </button>
        </div>
        <input id="senha" name="senha" type="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </div>

      <label class="remember">
        <input type="checkbox" name="lembrar" />
        Manter conectado
      </label>

      <button type="submit" class="submit">Entrar</button>
    </form>

    <p class="signup">Não tem conta? <a href="cadastro.html">Criar acesso</a></p>
  </main>
</body>
</html>
