<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha · Controle Eventual</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 24px;
    }
    .glow {
      position: fixed; inset: -25% 0 auto 0; height: 460px; pointer-events: none; z-index: 0;
      background: radial-gradient(55% 100% at 50% 0%, rgba(34,197,94,.14), transparent 70%);
    }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px 30px;
      box-shadow: 0 24px 60px -24px rgba(0,0,0,.6);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .brand .mark {
      width: 34px; height: 34px; border-radius: 9px; flex: none;
      background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center; font-weight: 800; font-size: 17px;
    }
    .brand .name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }

    h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 700; }
    .sub { margin: 0 0 24px; color: var(--fg-muted); font-size: 14.5px; }

    form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 13px; font-weight: 600; color: var(--fg); }
    input[type="email"] {
      width: 100%; min-height: 44px; background: var(--bg);
      border: 1px solid var(--border-strong); border-radius: 10px;
      color: var(--fg); font-size: 15px; padding: 0 14px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder { color: var(--fg-faint); }
    input:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
    input[aria-invalid="true"] { border-color: var(--danger); }

    .error { color: var(--danger); font-size: 12.5px; min-height: 1em; }
    .error a { color: var(--info); font-weight: 600; }

    .hint { font-size: 12px; color: var(--fg-faint); margin: -6px 0 0; }

    .submit {
      min-height: 46px; margin-top: 4px;
      background: var(--accent); color: var(--on-accent);
      border: 0; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s ease;
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(34,197,94,.35); }

    .back { margin: 22px 0 0; text-align: center; font-size: 13.5px; }
    .back a { color: var(--info); font-weight: 600; text-decoration: none; }
    .back a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="card">
    <div class="brand">
      <span class="mark">CE</span>
      <span class="name">Controle Eventual</span>
    </div>

    <h1>Recuperar senha</h1>
    <p class="sub">Informe o e-mail da sua conta para definir uma nova senha.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="voce@exemplo.com" required />
      </div>
      <p class="error" id="error" role="alert"></p>
      <p class="hint">No momento a redefinição acontece direto na próxima tela. Quando o app tiver e-mail configurado, enviaremos um link por e-mail.</p>
      <button type="submit" class="submit">Continuar</button>
    </form>

    <p class="back"><a href="login.html">← Voltar ao login</a></p>
  </main>

  <script src="auth.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var error = document.getElementById('error');
      error.innerHTML = '';
      if (CEAuth.accountExists(email)) {
        location.href = 'redefinir-senha.html?email=' + encodeURIComponent(email);
      } else {
        error.innerHTML = 'Não encontramos uma conta com esse e-mail. ' +
          '<a href="cadastro.html">Criar acesso</a>';
      }
    });
  </script>
</body>
</html>
