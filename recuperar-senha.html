<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha · Controle Eventual</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 24px;
    }
    .glow {
      position: fixed; inset: -25% 0 auto 0; height: 460px; pointer-events: none; z-index: 0;
      background: radial-gradient(55% 100% at 50% 0%, rgba(34,197,94,.14), transparent 70%);
    }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px 30px;
      box-shadow: 0 24px 60px -24px rgba(0,0,0,.6);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .brand .mark {
      width: 34px; height: 34px; border-radius: 9px; flex: none;
      background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center; font-weight: 800; font-size: 17px;
    }
    .brand .name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }

    h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 700; }
    .sub { margin: 0 0 24px; color: var(--fg-muted); font-size: 14.5px; }

    form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 13px; font-weight: 600; color: var(--fg); }
    input[type="email"] {
      width: 100%; min-height: 44px; background: var(--bg);
      border: 1px solid var(--border-strong); border-radius: 10px;
      color: var(--fg); font-size: 15px; padding: 0 14px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder { color: var(--fg-faint); }
    input:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px rgba(34,197,94,.25); }

    .submit {
      min-height: 46px; margin-top: 4px;
      background: var(--accent); color: var(--on-accent);
      border: 0; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s ease;
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(34,197,94,.35); }

    .back { margin: 22px 0 0; text-align: center; font-size: 13.5px; }
    .back a { color: var(--info); font-weight: 600; text-decoration: none; }
    .back a:hover { text-decoration: underline; }

    /* estado de confirmação (aparece após enviar) */
    .sent { display: none; text-align: center; }
    .sent .icon {
      width: 52px; height: 52px; margin: 4px auto 18px; border-radius: 50%;
      background: rgba(34,197,94,.14); border: 1px solid rgba(34,197,94,.3);
      display: grid; place-items: center;
    }
    .sent .icon svg { width: 26px; height: 26px; stroke: var(--accent); }
    .sent h1 { margin-bottom: 8px; }
    .sent p { color: var(--fg-muted); font-size: 14.5px; margin: 0 0 6px; }
    .sent .mail { color: var(--fg); font-weight: 600; }

    body.done .form-view { display: none; }
    body.done .sent { display: block; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="card">
    <div class="brand">
      <span class="mark">CE</span>
      <span class="name">Controle Eventual</span>
    </div>

    <div class="form-view">
      <h1>Recuperar senha</h1>
      <p class="sub">Digite o e-mail da sua conta e enviaremos um link para redefinir a senha.</p>

      <form id="form" action="#" method="post" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="voce@exemplo.com" required />
        </div>
        <button type="submit" class="submit">Enviar link de redefinição</button>
      </form>

      <p class="back"><a href="login.html">← Voltar ao login</a></p>
    </div>

    <div class="sent">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6.5" />
        </svg>
      </div>
      <h1>Verifique seu e-mail</h1>
      <p>Se houver uma conta associada a</p>
      <p class="mail" id="sent-mail">seu e-mail</p>
      <p>enviamos um link para redefinir a senha. Ele expira em 30 minutos.</p>
      <p class="back"><a href="login.html">← Voltar ao login</a></p>
    </div>
  </main>

  <script>
    // Demonstração de fluxo: exibe o estado de confirmação sem back-end real.
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      if (email) document.getElementById('sent-mail').textContent = email;
      document.body.classList.add('done');
    });
  </script>
</body>
</html>
